name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

  # Soft, non-blocking nudge for the CLAUDE.md convention that user-facing
  # changes (new pages/routes, schema changes, new env vars) should update
  # README.md in the same PR. Only a heuristic on file paths — can't judge
  # intent, so it warns rather than fails, and false positives (legitimate
  # internal-only changes) are expected and fine to ignore.
  readme-doc-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for likely-undocumented changes
        run: |
          set -e
          PARENT=$(git rev-parse HEAD^1 2>/dev/null || git rev-parse HEAD~1)
          CHANGED=$(git diff --name-only "$PARENT" HEAD)

          RISKY=false
          echo "$CHANGED" | grep -qE '^src/app/.*/page\.tsx$' && RISKY=true
          echo "$CHANGED" | grep -qE '^src/app/api/.*/route\.ts$' && RISKY=true
          echo "$CHANGED" | grep -qE '^prisma/schema\.prisma$' && RISKY=true
          echo "$CHANGED" | grep -qE '^\.env\.example$' && RISKY=true

          if [ "$RISKY" = true ] && ! echo "$CHANGED" | grep -qE '^README\.md$'; then
            echo "::warning::This push added/changed a page, API route, prisma/schema.prisma, or .env.example without touching README.md. Per CLAUDE.md, user-facing changes should document that in the same PR — double check this isn't a gap (internal-only changes are exempt)."
            {
              echo "## ⚠️ Possible README documentation gap"
              echo ""
              echo "This push touched a page, API route, \`prisma/schema.prisma\`, or \`.env.example\` without touching \`README.md\`."
              echo ""
              echo "Per this repo's CLAUDE.md convention, changes like these should update README.md in the same PR. If this is a legitimate exception (internal refactor, no user-facing change), no action needed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No documentation gap detected."
          fi

  # Soft, non-blocking nudge for the CLAUDE.md convention that a real
  # judgment call (alternatives considered, an architecture/schema-shaping
  # decision, an explicit deferral) should get an entry in DECISIONS.md in
  # the same PR. Keyed only off prisma/schema.prisma — the one file-path
  # signal reliable enough not to fire on most ordinary page/route work,
  # since not every change is a "decision" worth logging. Narrower than the
  # README check on purpose; still just a heuristic, so false positives
  # (a schema change with no real judgment call behind it) are expected.
  decisions-doc-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for likely-undocumented decisions
        run: |
          set -e
          PARENT=$(git rev-parse HEAD^1 2>/dev/null || git rev-parse HEAD~1)
          CHANGED=$(git diff --name-only "$PARENT" HEAD)

          if echo "$CHANGED" | grep -qE '^prisma/schema\.prisma$' && ! echo "$CHANGED" | grep -qE '^DECISIONS\.md$'; then
            echo "::warning::This push changed prisma/schema.prisma without touching DECISIONS.md. Per CLAUDE.md, a schema-shaping decision should get an entry in the same PR — double check this isn't a gap (a purely mechanical schema tweak is exempt)."
            {
              echo "## ⚠️ Possible DECISIONS.md gap"
              echo ""
              echo "This push changed \`prisma/schema.prisma\` without touching \`DECISIONS.md\`."
              echo ""
              echo "Per this repo's CLAUDE.md convention, a schema-shaping decision should get an entry in the same PR. If this is a legitimate exception (a mechanical schema tweak with no real judgment call behind it), no action needed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No documentation gap detected."
          fi
